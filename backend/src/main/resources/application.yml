spring:
  application:
    name: meal-budget-diet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meal_budget_diet}
    username: ${DB_USERNAME:mealbudget}
    password: ${DB_PASSWORD:mealbudget}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  session:
    timeout: -1s
    jdbc:
      initialize-schema: never

app:
  bootstrap-token: ${BOOTSTRAP_TOKEN:}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  password-reset:
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
    email-enabled: ${PASSWORD_RESET_EMAIL_ENABLED:false}
    email-from: ${PASSWORD_RESET_EMAIL_FROM:no-reply@mealbudgetdiet.local}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:}
    dispatch-enabled: ${PUSH_DISPATCH_ENABLED:true}
    dispatch-interval-ms: ${PUSH_DISPATCH_INTERVAL_MS:30000}
    initial-delay-ms: ${PUSH_INITIAL_DELAY_MS:10000}
  media:
    bucket: ${MEDIA_BUCKET:meal-budget-diet}
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9000}
    region: ${MEDIA_REGION:ap-northeast-2}
    access-key: ${MEDIA_ACCESS_KEY:mealbudget}
    secret-key: ${MEDIA_SECRET_KEY:mealbudget-secret}
    temp-retention: ${MEDIA_TEMP_RETENTION:24h}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: MBD_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
