spring:
  application:
    name: meal-budget-diet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meal_budget_diet}
    username: ${DB_USERNAME:mealbudget}
    password: ${DB_PASSWORD:mealbudget}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: always

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: MBD_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
