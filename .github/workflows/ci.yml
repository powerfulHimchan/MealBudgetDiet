name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  full-stack-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: mealbudgetdiet-e2e
      POSTGRES_DB: meal_budget_diet_e2e
      POSTGRES_USER: mealbudget_e2e
      POSTGRES_PASSWORD: mealbudget-e2e-password
      BOOTSTRAP_TOKEN: e2e-bootstrap-token-only-for-ci
      AUTH_RATE_LIMIT_SECRET: e2e-rate-limit-secret-is-longer-than-32-characters
      PUBLIC_BASE_URL: http://127.0.0.1:3000
      PUSH_DISPATCH_ENABLED: "false"
      MEDIA_BUCKET: meal-budget-diet-e2e
      MEDIA_ACCESS_KEY: mealbudget-e2e
      MEDIA_SECRET_KEY: mealbudget-e2e-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the full application
        run: docker compose up --build --detach
      - name: Wait for the application
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/bootstrap/status > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Run full-stack E2E
        working-directory: frontend
        run: npm run e2e:full-stack
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color > e2e-services.log
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-e2e-failure
          path: |
            e2e-services.log
            frontend/playwright-report/full-stack
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the full application
        if: always()
        run: docker compose down --volumes --remove-orphans
