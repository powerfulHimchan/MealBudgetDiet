name: Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-test-apk
    paths:
      - "android/**"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sikbi-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sikbi-test-apk
          path: Sikbi-test.apk
          if-no-files-found: error
          retention-days: 14
