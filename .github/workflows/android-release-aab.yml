name: Android release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release-aab.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify signing secrets
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore upload key
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/sikbi-upload.jks
          {
            printf 'storeFile=%s\n' 'sikbi-upload.jks'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/sikbi-upload.jks android/keystore.properties

      - name: Build signed AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Verify signature and prepare Play bundle
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab Sikbi-1.1.0.aab
          cp android/release-notes/1.1.0-ko.txt release-notes-ko.txt
          sha256sum Sikbi-1.1.0.aab > SHA256SUMS.txt

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Sikbi-1.1.0-play-bundle
          path: |
            Sikbi-1.1.0.aab
            release-notes-ko.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        run: rm -f android/sikbi-upload.jks android/keystore.properties
